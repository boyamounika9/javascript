</body>
<script>
    let array = [];

    let oddnum=document.getElementById('oddnum')
    let greaterthann=document.getElementById('greaterthann')

    let input = document.getElementById('input')

    let even=document.getElementById('even')
    let odd=document.getElementById('odd')

    let result = document.getElementById('result')


    btn1.addEventListener('click', function (e) {
        e.preventDefault();
        let in_value = document.getElementById('input').value;
        array.push(in_value);
        result.textContent = array;
        input.value = "";


    })

    even.addEventListener('click',function(){
        let evennumbers=array.filter((a)=>{
            if(a%2==0){
                return a
            }
        })
        evennum.textContent=`The even numbers are : ${evennumbers}`
    })


     odd.addEventListener('click',function(){
        let oddnumbers=array.filter((a)=>{
            if(a%2!=0){
                return a
            }
        })
        oddnum.textContent=`The Odd numbers are : ${oddnumbers}`
    })

    filbtn.addEventListener('click',function(){
        let filter= +document.getElementById('filter').value
         let filterednums=array.filter((a)=>{

</script>
