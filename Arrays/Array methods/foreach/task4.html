<body>
    <h1>Calculate Total Salary</h1>
</body>
<script>
    let total=0;
let employees = [
    { name: "Rahul", salary: 25000 },
    { name: "Priya", salary: 35000 },
    { name: "Arun", salary: 45000 }
];
employees.forEach(function(a){
    total+=a.salary;
})
console.log(total)
</script>
