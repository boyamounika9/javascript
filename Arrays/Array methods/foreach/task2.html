<body>
    <h1>Count Even and Odd Numbers</h1>
</body>
<script>
    let Evencount=0;
    let Oddcount=0
let numbers = [10, 15, 20, 25, 30, 35];
numbers.forEach(function(a){
    if(a%2==0){
        Evencount++
    }
    else Oddcount++
})
console.log("Evencount: " +Evencount);
console.log("Oddcount: " +Oddcount);



</script>
</html>
