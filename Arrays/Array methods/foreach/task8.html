<body>
    <h1>Shopping Cart Problem</h1>
    
</body>
<script>
    let cart = [
    { name: "Laptop", price: 50000 },
    { name: "Mouse", price: 1000 },
    { name: "Keyboard", price: 2000 },
    { name: "Monitor", price: 15000 }
];
// cart.forEach((a,b)=>{
//     if(a.price<5000){
//         cart.splice(b,1)
//     }
// })

[...cart].reverse().forEach((a) => {
    if (a.price < 5000) {
        let index = cart.indexOf(a);
        cart.splice(index, 1);
    }
});

console.log(cart)
</script>
