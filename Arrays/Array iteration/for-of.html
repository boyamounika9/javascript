<body>
    <script>

        //syntax: for(let any_variable_name in arrayvariable_name );



        //it gives directly array values
        let arr1 = [3, 8, 9, 2, 6, 5];
        for (let i of arr1) {
            console.log(i)
        }

        //sum of array values
        console.log("sum of array values")
        let sum=0;
        let arr2 = [3, 8, 9, 2, 6, 5];
        for (let i of arr2) {
            sum+=i;
        }
        console.log(sum)
    </script>
</body>
