<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        //syntax: for(let any_variable_name in arrayvariable_name);


        //it givesindex value in sequential order 
         let arr1=[3,8,9,2,6,5];
        for (let i in arr1){
            console.log(i)
        }



        //it gives the array elements
         let arr2=[3,8,9,2,6,5];
        for (let i in arr2){
            console.log(arr2[i])
        }
    </script>
</body>
</html>
