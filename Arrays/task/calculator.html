<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f2f2f2;
            font-family: Arial, sans-serif;
        }

        .calculator {
            width: 300px;
            padding: 20px;
            background-color: #222;
            border-radius: 15px;
        }

        .display {
            width: 100%;
            height: 60px;
            margin-bottom: 15px;
            padding: 10px;
            font-size: 25px;
            text-align: right;
            border: none;
            border-radius: 8px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 55px;
            font-size: 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background-color: #ddd;
        }

        .operator {
            background-color: orange;
            color: white;
        }

        .equal {
            background-color: green;
            color: white;
        }

        .clear {
            background-color: red;
            color: white;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <input type="text" id="inputfield" class="display" value="0" readonly>

        <div class="buttons">

            <button class="clear" id="clear">C</button>
            <button id="num-7">7</button>
            <button id="num-8">8</button>
            <button id="num-9">9</button>

            <button class="operator" id="add">+</button>
            <button id="num-4">4</button>
            <button id="num-5">5</button>
            <button id="num-6">6</button>

            <button class="operator" id="sub">-</button>
            <button id="num-1">1</button>
            <button id="num-2">2</button>
            <button id="num-3">3</button>

            <button class="operator" id="mul">*</button>
            <button>0</button>
            <button class="operator" id="divi">/</button>
            <button class="equal" id="equal">=</button>

        </div>

    </div>

</body>
<script>
    let input=document.getElementById('inputfield');
    let one=document.getElementById('num-1');
    let two=document.getElementById('num-2');

    let three=document.getElementById('num-3');

    let four=document.getElementById('num-4');

    let five=document.getElementById('num-5');

    let six=document.getElementById('num-6');

    let seven=document.getElementById('num-7');
    let eight=document.getElementById('num-8');

    let nine=document.getElementById('num-9');


    let addition=document.getElementById('add');
    let subtraction=document.getElementById('sub');

    let multiplication=document.getElementById('mul');

    let division=document.getElementById('divi');
    let total=document.getElementById('equal');

    




</script>

</html>
