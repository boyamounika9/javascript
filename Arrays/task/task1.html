<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let even=0;
        let odd=0;
        const numbers = [12, 7, 8, 15, 20, 33, 40];
         for(i of numbers){
            if(i%2==0){
                even++
            }
            else{
                odd++
            }
         }
         console.log("even numbers:"+even);
         console.log("odd numbers:"+odd);

    </script>
</body>
</html>
