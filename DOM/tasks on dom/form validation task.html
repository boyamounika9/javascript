<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="..//bootstrap/bootstrap-5.3.8-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    
</head>

<body>

    <header class="header bg-warning p-2">Login</header>
    <section class="text-center">
        <div class="col-6">
            <div class="card m-3">
                <div class="card-header">
                    <h4>Login</h4>
                </div>
                <div class="card-body ">
                    <form id="form">
                        <div class="mb-2 input-group">
                            <span class="input-group-text"><i class="bi bi-person-circle"></i></span>
                            <input type="text" class="form-control" id="usn" minlength="6">
                        </div>
                        <div class="mb-2 input-group">
                            <span  class="input-group-text  "><i class="bi bi-eye-fill" id="icon"></i></span>
                            <input type="password" class="form-control" id="pas"  minlength="6">
                            <span class="input-group-text" id="text">Show</span>
                        </div>
                        <input type="submit" value="Login" class=" btn btn-dark " id="sub">
                    </form>
                </div>
            </div>
        </div>
        <h3 id="h1-tag" class="bg-warning"></h3>
    </section>
</body>
<script>
    let username=document.getElementById('usn');
    let password=document.getElementById('pas');
    let h1tag=document.getElementById('h1-tag');




    username.addEventListener('change',function(){
        if(username.value.length<=6){
            alert('enter correct username');
        }
    })
    password.addEventListener('change',function(){
        if(password.value.length<=6){
            alert('enter correct password');
        }
    })

    form.addEventListener('submit',function(e){
        e.preventDefault();
        h1tag.textContent=`Your username is ${username.value} and Password is ${password.value} `
    })


</script>
</html>
