<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="..//bootstrap/bootstrap-5.3.8-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>

    <header class="header bg-warning p-2">Login</header>
    <section class="text-center">
        <div class="col-6">
            <div class="card m-3">
                <div class="card-header">
                    <h4>Login</h4>
                </div>
                <div class="card-body ">
                    <form>
                        <div class="mb-2 input-group">
                            <span class="input-group-text"><i class="bi bi-person-circle"></i></span>
                            <input type="text" class="form-control" id="usn">
                        </div>
                        <div class="mb-2 input-group">
                            <span  class="input-group-text  "><i class="bi bi-eye-fill" id="icon"></i></span>
                            <input type="password" class="form-control" id="pas">
                            <span class="input-group-text" id="text">Show</span>
                        </div>
                        <input type="submit" value="Login" class=" btn btn-dark " id="sub">
                    </form>
                </div>
            </div>
        </div>
    </section>
</body>
<script>
    let eyeicon=document.getElementById('icon');
    let pass=document.getElementById('pas');
    let textcon=document.getElementById('text');

    eyeicon.addEventListener('click',function(){
        if(eyeicon.getAttribute('class') =='bi bi-eye-fill'){
            eyeicon.classList.remove('bi-eye-fill');
            eyeicon.classList.add('bi-eye-slash-fill');
            pass.setAttribute('type','text');
            textcon.textContent='hide'
        }
        else{
            eyeicon.classList.remove('bi-eye-slash-fill');
            eyeicon.classList.add('bi-eye-fill');
            pass.setAttribute('type','password');
            textcon.textContent='show'
        }
    })


</script>
</html>
