<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter App</title>
    <style>
        *{
            margin: 0px;
        }
        nav{
            background-color: cornflowerblue;
            color: white;
            padding: 20px;
            font-size: larger;
        }
        section{
            
            
            
        }
        section>#counterapp{
            height: auto;
            width: 300px;
            align-items: center;
            padding: 30px;
            margin: 50px auto;
        }
    </style>
</head>
<body>
    <nav>
        <h2>🕰️ Counter App</h2>
    </nav>
    <section>
        <div id="Counterapp">
            <h2>Counter</h2>
            <h3 id="counttext"></h3>
            <button onclick="inc()">INC</button>
            <button onclick="dec()">DEC</button>

        </div>
    </section>
</body>
<script>
    let countext=document.getElementById('counttext');

    let c=0;
    countext.textContent=c;

    function inc(){
        c=c+1;
        countext.textContent=c;
    }

    function dec(){
        if (c>0){
             c=c-1;
             countext.textContent=c;
        }
    }

</script>
</html>
