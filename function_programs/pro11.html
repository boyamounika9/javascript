    <h1> Convert to Arrow Function </h1>
</body>
<script>
    //Convert this:
     function calculate(a, b) {
         return a * b;
         }
         // into an arrow function with an implicit return 
         let fun=(a,b)=>{
            console.log(a*b)
         }
         fun(3,2)
         //or
          let func=(a,b)=>
            console.log(a*b)
         func(3,7)
</script>
