<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1> Callback Returning a Value </h1>
</body>
<script>
    function execute(callback) {
    const result = callback(10);
    console.log("Inside:", result);
    return result * 2;
}

const answer = execute((value) => {
    return value + 5;
});

console.log("Outside:", answer);
</script>
</html>
