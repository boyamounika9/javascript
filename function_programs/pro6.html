<body>
    <h1> Callback With Multiple Parameters </h1>
</body>
<script>
    function calculate(a, b, callback) {

        const result = callback(a, b);
        return result;
    }
    const subtract = (x, y) => x - y;
    console.log(calculate(20, 8, subtract)); 
</script>
