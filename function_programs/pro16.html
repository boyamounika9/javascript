<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1> Multiple DOM Changes </h1>
    <h2 id="title">JavaScript</h2>
     <p id="message">Learning DOM</p> 
    <button id="btn">Update</button> 
</body>
<script>
    /*When the button is clicked:
     h2 → DOM Manipulation 
     p  → Learning JavaScript 
     Also change the color of the heading to blue. */

     let title_name=document.getElementById('title');
     let mess=document.getElementById('message');
     let btn=document.getElementById('btn');

     btn.addEventListener('click',()=>{
        title_name.textContent=" DOM Manipulation ";
        title_name.style.color="blue";
        mess.textContent="Learning JavaScript ";

     })
</script>
</html>
