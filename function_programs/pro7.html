<body>
    <h1>Return the Callback Result </h1>
</body>
<script>
    //Compare: 
    function process(callback) {
        callback();
    }
    //with: 
    function process(callback) {
        return callback();
    }
    //Given:
    const result = process(() => {
        return "Success";
    });
    console.log(result); 
</script>

</html>
