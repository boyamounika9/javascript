    <h1>Arrow Function With Condition </h1>
</body>
<script>
    /*Create an arrow function:
     checkNumber(number)
      Requirements:
       number > 0  → "Positive"
        number < 0  → "Negative" 
        number === 0 → "Zero" 
        Use an arrow function and return the appropriate value. */

        let checkNumber=(number)=>{
            if(number>0)return "Positive"

            if(number<0)return "Negative" 

            return "Zero"
        }
         console.log(checkNumber(-90));
</script>
