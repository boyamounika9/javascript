<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
<h1> Return a Function </h1>
</body>
<script>
    function createGreeting(name) {
        return function () {
            return "Hello " + name;
        };
    }
    const greet = createGreeting("Rahul");
    console.log(greet()); 
</script>

</html>
