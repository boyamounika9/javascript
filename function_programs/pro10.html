<!DOCTYPE html>

    <title>Document</title>
</head>
<body>
    <h1> Function Returning a Higher-Order Function </h1>
</body>
<script>
    function createOperation(operator) {
    return function (a, b) {
        if (operator === "add") {
            return a + b;
        }
        return a - b;
    };
}

const operation = createOperation("add");

console.log(operation(10, 5));
</script>
</html>
